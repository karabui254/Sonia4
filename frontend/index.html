<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonia 4.0 Farm</title><link rel="stylesheet" href="./css/main.css"></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo"><div class="mark logo-img"></div><div><div class="brandname">Sonia 4.0 Farm</div><div class="sub">Healthy Chicks | Better Yields | A Brighter Future</div></div></div><h2>Secure sign in</h2><div id="loginMsg" class="notice hidden"></div><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="field"><label>Two-factor code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code"></div><button class="primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><p class="sub" style="margin-top:14px">Authorized users only. Use HTTPS in production.</p></div></div>
