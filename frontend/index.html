<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonia 4.0 Farm</title><link rel="stylesheet" href="/css/main.css"></head>
<body>
<section id="login" class="login"><form id="loginForm" class="loginbox"><img class="brand-logo" src="/assets/sonia-logo.png" alt="Sonia 4.0 Farm"><h1>Sign in to Sonia</h1><p>Farm operations and financial management</p><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><label for="otp">Authenticator code (if enabled)</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code"><p id="loginError" role="alert"></p><button class="primary">Sign in</button></form></section>
<div id="app" hidden><header><button id="menuToggle" aria-label="Toggle navigation" aria-controls="nav" aria-expanded="false">☰</button><strong>Sonia 4.0 Farm</strong><input id="search" type="search" placeholder="Find a section" aria-label="Find a section"><span id="who"></span><button id="signout">Sign out</button></header><div class="layout"><nav id="nav" aria-label="Main navigation"></nav><main id="main" tabindex="-1"></main></div></div>
<dialog id="dialog"><div id="dialogContent"></div><button id="closeDialog" type="button">Close</button></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/js/presentation.js" defer></script>
<script src="/js/app.js" defer></script></body></html>
